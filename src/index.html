<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="password" id="contrasena" placeholder="Contraseña" required>
            
            <button type="submit">Ingresar</button>
            
            <p id="mensaje"></p>
        </form>

        <div id="usuariosPrueba" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666;">
            <strong>Usuarios disponibles:</strong>
            <ul style="margin: 10px 0; padding-left: 20px;">
                <li>Usuario: <strong>admin</strong> | Contraseña: <strong>admin123</strong></li>
                <li>Usuario: <strong>usuario</strong> | Contraseña: <strong>usuario123</strong></li>
                <li>Usuario: <strong>test</strong> | Contraseña: <strong>test123</strong></li>
            </ul>
        </div>
    </div>

    <script src="crud.js"></script>
    <script src="validaciones.js"></script>
    <script src="code.js"></script>
</body>
</html>
